<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TuxVentas2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">TuxVentas2</a>

        <div>
            <a class="text-white mx-2" href="#inicio">Inicio</a>
            <a class="text-white mx-2" href="#categorias">Categorías</a>
            <a class="text-white mx-2" href="#productos">Productos</a>
        </div>
    </div>
</nav>

<div id="carrusel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="img/carrusel-1.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="img/carrusel-2.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="img/carrusel-3.jpg" class="d-block w-100">
        </div>

    </div>

</div>

<section id="inicio" class="text-center p-5">
    <h1>Bienvenido a TuxVentas2</h1>
    <p>Encuentra los mejores productos.</p>
    <a href="#productos" class="btn btn-primary">Ver productos</a>
</section>

<section id="categorias" class="container py-5">

    <h2 class="text-center mb-4">Categorías</h2>

    <div class="row">

        <div class="col-md-3">
            <img src="img/cat-1.jpg" class="img-fluid">
        </div>

        <div class="col-md-3">
            <img src="img/cat-2.jpg" class="img-fluid">
        </div>

        <div class="col-md-3">
            <img src="img/cat-3.jpg" class="img-fluid">
        </div>

        <div class="col-md-3">
            <img src="img/cat-4.jpg" class="img-fluid">
        </div>

    </div>

</section>

<section class="container py-5">

    <h2 class="text-center mb-4">Ofertas</h2>

    <div class="row">

        <div class="col-md-6">
            <img src="img/oferta-1.jpg" class="img-fluid">
        </div>

        <div class="col-md-6">
            <img src="img/oferta-2.jpg" class="img-fluid">
        </div>

    </div>

</section>

<section id="productos" class="container py-5">

    <h2 class="text-center mb-4">Productos</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card">
                <img src="img/product-1.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Producto 1</h5>
                    <button class="btn btn-primary">Comprar</button>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="img/product-2.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Producto 2</h5>
                    <button class="btn btn-primary">Comprar</button>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="img/product-3.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Producto 3</h5>
                    <button class="btn btn-primary">Comprar</button>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="img/product-4.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Producto 4</h5>
                    <button class="btn btn-primary">Comprar</button>
                </div>
            </div>
        </div>

    </div>

</section>

<footer class="bg-dark text-white text-center p-3">
    © 2026 TuxVentas2
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
